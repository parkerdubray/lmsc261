<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

    <script>
    function noParams() {
        alert("noParams was called.");
    } 
    function threeParams(param1, param2, param3) {
        alert("threeParams was called. \n" +
        "Param 1: " + param1 + "\n" +
        "Param 2: " + param2 + "\n" +
        "Param 3: " + param3);
    }
    function greeting() {
        let name = prompt("What is your name?");
        alert("Hello, " + name + ". Nice to meet you!");
    }
    </script>
</body>

</html>
